services:
  postgres:
    image: postgres:16-alpine
    container_name: bus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bus
      POSTGRES_PASSWORD: bus
      POSTGRES_DB: bus_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus -d bus_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bus-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: bus
      RABBITMQ_DEFAULT_PASS: bus
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP local para o notification-service (UI em :8025)
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: bus-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # Observabilidade mínima (all-in-one):
  # - Grafana UI
  # - Prometheus (métricas)
  # - Loki (logs)
  # - Tempo (traces)
  # - OTLP receiver :4317 (gRPC) / :4318 (HTTP)
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.0
    container_name: bus-otel-lgtm
    restart: unless-stopped
    ports:
      - "3005:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - lgtm_data:/data

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  lgtm_data:
